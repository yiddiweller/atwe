<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0b0c0e"/>
<meta name="robots" content="noindex, nofollow"/>
<title>Atwe · Features</title>
<link rel="icon" href="/icon.png"/>
<style>
  /* ── Palette. Follows the device by default; the admin dashboard embeds this
     page with ?theme=dark so it matches the surrounding chrome. ── */
  :root{
    --bg:#f6f7f8; --panel:#ffffff; --panel2:#f0f2f4;
    --ink:#12141a; --ink2:#3d434e; --mut:#6b7280; --hair:#e4e7ea;
    --accent:#1f8fff; --accent-soft:#e7f2ff;
    --amber:#a9700f; --amber-bg:#f8efdd;
    --danger:#dc4a54;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --r:14px;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0b0c0e; --panel:#14161b; --panel2:#191c22;
      --ink:#eef0f3; --ink2:#c2c7cf; --mut:#8a9099; --hair:#20242b;
      --accent:#3f9bff; --accent-soft:#152534;
      --amber:#e0a33e; --amber-bg:#2a2113;
      --danger:#f0616d;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0b0c0e; --panel:#14161b; --panel2:#191c22;
    --ink:#eef0f3; --ink2:#c2c7cf; --mut:#8a9099; --hair:#20242b;
    --accent:#3f9bff; --accent-soft:#152534;
    --amber:#e0a33e; --amber-bg:#2a2113;
    --danger:#f0616d;
  }
  :root[data-theme="light"]{
    --bg:#f6f7f8; --panel:#ffffff; --panel2:#f0f2f4;
    --ink:#12141a; --ink2:#3d434e; --mut:#6b7280; --hair:#e4e7ea;
    --accent:#1f8fff; --accent-soft:#e7f2ff;
    --amber:#a9700f; --amber-bg:#f8efdd;
    --danger:#dc4a54;
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
    font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:860px;margin:0 auto;padding:26px 20px 90px}

  /* ── Header ── */
  .top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:4px}
  h1{font-size:27px;font-weight:800;letter-spacing:-.02em;margin:0}
  .count{color:var(--mut);font-size:14px;font-variant-numeric:tabular-nums}
  .lede{color:var(--mut);font-size:14.5px;margin:0 0 20px}

  /* ── Search + filter ── */
  .bar{position:sticky;top:0;z-index:20;background:var(--bg);padding:10px 0 12px;margin-bottom:2px}
  .search{width:100%;padding:11px 14px;border:1px solid var(--hair);border-radius:11px;
    background:var(--panel);color:var(--ink);font:inherit;font-size:15px;outline:none}
  .search:focus{border-color:var(--accent)}
  .chips{display:flex;gap:7px;overflow-x:auto;margin-top:10px;padding-bottom:2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;padding:6px 13px;border-radius:999px;border:1px solid var(--hair);
    background:var(--panel);color:var(--ink2);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
  .chip:hover{border-color:var(--accent)}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}

  /* ── The list ── */
  .group{margin-top:26px}
  .ghead{display:flex;align-items:baseline;gap:9px;padding:0 4px 9px;border-bottom:1px solid var(--hair)}
  .gname{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
  .gnum{font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
  .row{display:flex;gap:12px;align-items:flex-start;padding:13px 4px;border-bottom:1px solid var(--hair)}
  .row:last-child{border-bottom:none}
  .row-main{flex:1;min-width:0}
  .row-name{font-size:15.5px;font-weight:650;letter-spacing:-.01em}
  .row-desc{font-size:14px;color:var(--mut);margin-top:2px}
  .row-acts{flex:0 0 auto;display:flex;gap:4px;opacity:0;transition:opacity .15s}
  .row:hover .row-acts,.row:focus-within .row-acts{opacity:1}
  @media (hover:none){.row-acts{opacity:1}}
  .iconbtn{width:30px;height:30px;display:grid;place-items:center;border:none;background:none;
    border-radius:8px;cursor:pointer;color:var(--mut)}
  .iconbtn:hover{background:var(--panel2);color:var(--ink)}
  .iconbtn.del:hover{color:var(--danger)}
  .iconbtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;
    stroke-linecap:round;stroke-linejoin:round}
  .tag{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:999px;
    font-size:11px;font-weight:700;letter-spacing:.02em;vertical-align:1px}
  .tag.planned{background:var(--amber-bg);color:var(--amber)}
  .tag.mine{background:var(--accent-soft);color:var(--accent)}

  /* ── Add / edit ── */
  .addbtn{position:fixed;right:20px;bottom:22px;z-index:30;display:flex;align-items:center;gap:8px;
    padding:12px 19px;border:none;border-radius:999px;background:var(--accent);color:#fff;
    font:inherit;font-size:15px;font-weight:700;cursor:pointer;
    box-shadow:0 6px 22px rgba(0,0,0,.22)}
  .addbtn:active{transform:scale(.97)}
  .addbtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
  .form{background:var(--panel);border:1px solid var(--hair);border-radius:var(--r);
    padding:16px;margin-top:18px}
  .form h3{margin:0 0 12px;font-size:16px;font-weight:750}
  .form label{display:block;font-size:12.5px;font-weight:700;color:var(--ink2);margin:11px 0 5px}
  .form input,.form textarea{width:100%;padding:10px 12px;border:1px solid var(--hair);border-radius:9px;
    background:var(--bg);color:var(--ink);font:inherit;font-size:14.5px;outline:none;resize:vertical}
  .form input:focus,.form textarea:focus{border-color:var(--accent)}
  .form-acts{display:flex;gap:8px;margin-top:15px}
  .btn{padding:9px 17px;border-radius:999px;border:1px solid var(--hair);background:var(--panel);
    color:var(--ink);font:inherit;font-size:14px;font-weight:650;cursor:pointer}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:disabled{opacity:.5;cursor:default}
  .hidden{display:none!important}

  .empty{color:var(--mut);font-size:14.5px;padding:34px 4px;text-align:center}
  .saved{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(14px);
    background:var(--ink);color:var(--bg);padding:9px 17px;border-radius:999px;font-size:13.5px;
    font-weight:650;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50}
  .saved.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ── Locked (no admin token yet) ── */
  .locked{min-height:70vh;display:grid;place-items:center;text-align:center;padding:30px}
  .locked h2{font-size:20px;font-weight:750;margin:14px 0 6px}
  .locked p{color:var(--mut);font-size:14.5px;margin:0 0 16px;max-width:330px}
</style>
</head>
<body>

<div id="lockedView" class="locked hidden">
  <div>
    <h2>Sign in to see this</h2>
    <p>The feature list is private to Atwe staff.</p>
    <button class="btn primary" onclick="retryUnlock()">Try again</button>
  </div>
</div>

<div id="app" class="wrap hidden">
  <div class="top"><h1>Features</h1><span class="count" id="count"></span></div>
  <p class="lede">Everything Atwe does, in one list. Add your own as you think of them.</p>

  <div class="bar">
    <input id="search" class="search" type="search" placeholder="Search features…" autocomplete="off"/>
    <div class="chips" id="chips"></div>
  </div>

  <div id="formHost"></div>
  <div id="list"></div>
</div>

<button id="addBtn" class="addbtn hidden" onclick="openAdd()">
  <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  Add a feature
</button>

<div id="toast" class="saved">Saved</div>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   THE FEATURE LIST
   ───────────────────────────────────────────────────────────────────────────
   Deliberately a LIST, not a checklist. This page used to ask the owner to
   Keep / Skip / Undecide every one of 500-odd rows, which is the right shape
   for a one-time decision and the wrong shape for the thing it became: the
   living record of what Atwe does. So the decision controls are gone.

   Their old decisions are NOT deleted — `dec` and `notes` ride along untouched
   in the saved document, so nothing they once chose is destroyed by this
   change and it can be brought back if it is ever wanted again.

   Two sources, one list:
     • the catalog (features-data.js, admin-only) — what has been built
     • `custom` — features the owner adds here themselves
   Plus `deleted`, the ids they have removed, which is honoured for both.

   Saved per admin account on the server (not the device), so the list is the
   same on every phone and computer they sign in on.
   ═══════════════════════════════════════════════════════════════════════════ */

const KEY = "atwe_features_v1";
const EMBEDDED = (() => { try { return window.parent && window.parent !== window; } catch (e) { return false; } })();

// Theme override via ?theme=dark|light (the admin dashboard embeds this page).
(() => {
  try {
    const t = new URLSearchParams(location.search).get("theme");
    if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
})();

let BASE = [];                                    // the built catalog
let store = { dec:{}, notes:{}, ideas:"", custom:[], deleted:[], updatedAt:0 };
let FEATURES = [];                                // catalog + custom, minus deleted
let filterCat = "all", query = "", editingId = null;

try { const raw = localStorage.getItem(KEY); if (raw) store = Object.assign(store, JSON.parse(raw)); } catch (e) {}
for (const k of ["custom","deleted"]) if (!Array.isArray(store[k])) store[k] = [];
for (const k of ["dec","notes"]) if (!store[k] || typeof store[k] !== "object") store[k] = {};

const esc = (s) => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

/* ── Saving ─────────────────────────────────────────────────────────────────
   Local first so it is instant and survives a dropped connection, then a
   debounced push to the account so the list follows them between devices. */
let _syncT = null, _tok = null;
function save(quiet) {
  store.updatedAt = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {}
  if (!quiet) toast();
  if (!_tok) return;
  clearTimeout(_syncT);
  _syncT = setTimeout(async () => {
    try {
      await fetch("/api/admin/feature-selection", { method:"PUT",
        headers:{ Authorization:"Bearer "+_tok, "Content-Type":"application/json" },
        body: JSON.stringify({ selection: store }) });
    } catch (e) { /* the local copy still holds it; the next save retries */ }
  }, 700);
}
let _toastT = null;
function toast(msg) {
  const el = document.getElementById("toast"); if (!el) return;
  el.textContent = msg || "Saved";
  el.classList.add("show");
  clearTimeout(_toastT); _toastT = setTimeout(() => el.classList.remove("show"), 1400);
}
async function pull(tok) {
  _tok = tok;
  try {
    const r = await fetch("/api/admin/feature-selection", { headers:{ Authorization:"Bearer "+tok } });
    if (!r.ok) return;
    const remote = (await r.json()).selection;
    if (remote && (remote.updatedAt || 0) > (store.updatedAt || 0)) {
      store = Object.assign({ dec:{}, notes:{}, ideas:"", custom:[], deleted:[] }, remote);
      for (const k of ["custom","deleted"]) if (!Array.isArray(store[k])) store[k] = [];
      try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {}
    }
  } catch (e) {}
}

/* ── Building the list ── */
function build() {
  const gone = new Set(store.deleted.map(String));
  const fromCatalog = BASE
    .filter((f) => !gone.has(String(f.id)))
    .map((f) => ({
      id: String(f.id),
      name: f.name || "",
      desc: f.desc || "",
      cat: f.cat || "Other",
      planned: f.phase === "roadmap" || f.phase === "admin_idea",
      mine: false,
    }));
  const mine = store.custom
    .filter((f) => f && !gone.has(String(f.id)))
    .map((f) => ({
      id: String(f.id),
      name: f.name || "",
      desc: f.desc || "",
      cat: f.cat || "Added by me",
      planned: false,
      mine: true,
      from: f.from ? String(f.from) : null,
    }));

  // A row the owner EDITED replaces the catalog row it came from, in the same
  // place. Without this, editing anything silently moved it to the bottom of
  // the list, which reads like it was deleted and re-added.
  const catalogOrder = BASE.map((f) => String(f.id));
  const replacements = new Map();
  mine.forEach((f) => { if (f.from && catalogOrder.includes(f.from)) replacements.set(f.from, f); });

  FEATURES = [];
  catalogOrder.forEach((id) => {
    const swap = replacements.get(id);
    if (swap) { FEATURES.push(swap); return; }
    const orig = fromCatalog.find((x) => x.id === id);
    if (orig) FEATURES.push(orig);
  });
  // Anything genuinely new goes at the end, newest last.
  mine.forEach((f) => { if (!f.from || !replacements.has(f.from)) FEATURES.push(f); });
}

const catsOf = () => {
  const seen = [];
  FEATURES.forEach((f) => { if (!seen.includes(f.cat)) seen.push(f.cat); });
  return seen;
};

function matches(f) {
  if (filterCat !== "all" && f.cat !== filterCat) return false;
  if (!query) return true;
  const q = query.toLowerCase();
  return f.name.toLowerCase().includes(q) || f.desc.toLowerCase().includes(q) || f.cat.toLowerCase().includes(q);
}

/* ── Rendering ── */
const ICON = {
  edit: '<svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
  del:  '<svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>',
};

function renderChips() {
  const cats = catsOf();
  document.getElementById("chips").innerHTML =
    `<button class="chip ${filterCat==="all"?"on":""}" onclick="setCat('all')">All</button>` +
    cats.map((c) => `<button class="chip ${filterCat===c?"on":""}" onclick="setCat(${JSON.stringify(c).replace(/"/g,"&quot;")})">${esc(c)}</button>`).join("");
}
function setCat(c) { filterCat = c; renderChips(); renderList(); }

function renderList() {
  const shown = FEATURES.filter(matches);
  document.getElementById("count").textContent =
    FEATURES.length + (FEATURES.length === 1 ? " feature" : " features")
    + (shown.length !== FEATURES.length ? ` · ${shown.length} shown` : "");

  const host = document.getElementById("list");
  if (!shown.length) {
    host.innerHTML = `<div class="empty">${query ? "Nothing matches “" + esc(query) + "”." : "Nothing here yet."}</div>`;
    return;
  }
  // Group in the order the categories first appear, so the list reads the same
  // way every time rather than reshuffling as things are added.
  const groups = [];
  shown.forEach((f) => {
    let g = groups.find((x) => x.cat === f.cat);
    if (!g) groups.push(g = { cat: f.cat, items: [] });
    g.items.push(f);
  });
  host.innerHTML = groups.map((g) => `
    <div class="group">
      <div class="ghead"><span class="gname">${esc(g.cat)}</span><span class="gnum">${g.items.length}</span></div>
      ${g.items.map(rowHtml).join("")}
    </div>`).join("");
}

function rowHtml(f) {
  const tag = f.planned ? '<span class="tag planned">Planned</span>'
            : f.mine    ? '<span class="tag mine">Added by you</span>' : "";
  return `<div class="row">
    <div class="row-main">
      <div class="row-name">${esc(f.name)}${tag}</div>
      ${f.desc ? `<div class="row-desc">${esc(f.desc)}</div>` : ""}
    </div>
    <div class="row-acts">
      <button class="iconbtn" title="Edit" aria-label="Edit ${esc(f.name)}" onclick="openEdit('${esc(f.id)}')">${ICON.edit}</button>
      <button class="iconbtn del" title="Remove" aria-label="Remove ${esc(f.name)}" onclick="removeFeature('${esc(f.id)}')">${ICON.del}</button>
    </div>
  </div>`;
}

/* ── Add / edit ──────────────────────────────────────────────────────────────
   Editing a CATALOG feature keeps the original and stores the owner's version
   as their own row, so a future deploy of the catalog can never overwrite what
   they wrote. Editing one of their own edits it in place. */
function openAdd() { editingId = null; renderForm({ name:"", desc:"", cat:"" }); }
function openEdit(id) {
  const f = FEATURES.find((x) => x.id === id); if (!f) return;
  editingId = id; renderForm(f);
}
function closeForm() { editingId = null; document.getElementById("formHost").innerHTML = ""; }

function renderForm(f) {
  const cats = catsOf();
  document.getElementById("formHost").innerHTML = `
    <div class="form">
      <h3>${editingId ? "Edit feature" : "Add a feature"}</h3>
      <label for="fName">Name</label>
      <input id="fName" maxlength="120" placeholder="What is it called?" value="${esc(f.name)}"/>
      <label for="fDesc">What it does</label>
      <textarea id="fDesc" rows="3" maxlength="600" placeholder="A sentence is plenty.">${esc(f.desc)}</textarea>
      <label for="fCat">Section</label>
      <input id="fCat" maxlength="80" list="catList" placeholder="e.g. Money, or a new one" value="${esc(f.cat === "Added by me" ? "" : f.cat)}"/>
      <datalist id="catList">${cats.map((c) => `<option value="${esc(c)}"></option>`).join("")}</datalist>
      <div class="form-acts">
        <button class="btn primary" id="fSave" onclick="saveForm()">${editingId ? "Save" : "Add it"}</button>
        <button class="btn" onclick="closeForm()">Cancel</button>
      </div>
    </div>`;
  const n = document.getElementById("fName");
  if (n) { n.focus(); n.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); saveForm(); } }); }
  document.getElementById("formHost").scrollIntoView({ behavior:"smooth", block:"nearest" });
}

function saveForm() {
  const name = (document.getElementById("fName").value || "").trim();
  const desc = (document.getElementById("fDesc").value || "").trim();
  const cat  = (document.getElementById("fCat").value || "").trim() || "Added by me";
  if (!name) { document.getElementById("fName").focus(); toast("Give it a name first"); return; }

  const existing = editingId ? store.custom.find((c) => String(c.id) === String(editingId)) : null;
  if (existing) {
    existing.name = name; existing.desc = desc; existing.cat = cat;
  } else {
    // Editing a catalog row: hide the original and keep the owner's version, so
    // a catalog update can never quietly undo their wording.
    if (editingId) store.deleted.push(String(editingId));
    store.custom.push({ id: "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      name, desc, cat, from: editingId ? String(editingId) : undefined });
  }
  save();
  closeForm();
  build(); renderChips(); renderList();
}

function removeFeature(id) {
  const f = FEATURES.find((x) => x.id === id); if (!f) return;
  if (!confirm(`Remove “${f.name}” from the list?`)) return;
  const i = store.custom.findIndex((c) => String(c.id) === String(id));
  if (i >= 0) store.custom.splice(i, 1);            // one of theirs — gone entirely
  else store.deleted.push(String(id));              // a catalog row — hidden for them
  save("quiet"); toast("Removed");
  build(); renderChips(); renderList();
}

/* ── Search ── */
document.getElementById("search").addEventListener("input", (e) => {
  query = (e.target.value || "").trim();
  renderList();
});

/* ── Locked / unlocked ── */
function showLocked() {
  document.getElementById("lockedView").classList.remove("hidden");
  document.getElementById("app").classList.add("hidden");
  document.getElementById("addBtn").classList.add("hidden");
}
function showApp() {
  document.getElementById("lockedView").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  document.getElementById("addBtn").classList.remove("hidden");
}

/* ── Getting the admin token ──
   Every channel, because iOS Safari restricts localStorage inside an iframe and
   the page would otherwise falsely claim it was locked: a postMessage from the
   dashboard, the URL hash it embeds us with, our own localStorage, and finally
   the same-origin parent's. First non-empty wins. */
let ADMIN_TOK = null, _loaded = false;
window.addEventListener("message", (e) => {
  if (e.origin !== location.origin) return;
  const d = e.data;
  if (d && d.type === "atwe-admin-token" && typeof d.token === "string" && d.token) {
    ADMIN_TOK = d.token;
    if (!_loaded) init();
  }
});
function askParent() { try { if (EMBEDDED) window.parent.postMessage({ type:"atwe-admin-token-request" }, location.origin); } catch (e) {} }
function hashToken() { try { const m = /[#&]t=([^&]+)/.exec(location.hash || ""); if (m && m[1]) return decodeURIComponent(m[1]); } catch (e) {} return null; }
function anyToken() {
  let t = ADMIN_TOK || hashToken();
  if (!t) { try { t = localStorage.getItem("atwe_token"); } catch (e) {} }
  if (!t) { try { if (EMBEDDED && window.parent && window.parent.localStorage) t = window.parent.localStorage.getItem("atwe_token"); } catch (e) {} }
  return t || null;
}
async function init() {
  if (_loaded) return;
  const tok = anyToken();
  if (!tok) { askParent(); showLocked(); return; }
  try {
    const r = await fetch("/api/admin/features-data", { headers:{ Authorization:"Bearer "+tok } });
    if (!r.ok) { askParent(); showLocked(); return; }
    const d = await r.json();
    if (!d || !Array.isArray(d.features) || !d.features.length) { showLocked(); return; }
    if (_loaded) return;
    BASE = d.features; _loaded = true;
    await pull(tok);
    build(); renderChips(); renderList(); showApp();
  } catch (e) { askParent(); showLocked(); }
}
function retryUnlock() { askParent(); setTimeout(init, 200); }
askParent();
init();
</script>

</body>
</html>
