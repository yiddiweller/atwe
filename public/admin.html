function renderFeaturesView(){
  const stats = document.getElementById('stats'); if (stats) stats.style.display = 'none';
  const c = document.getElementById('content');
  // Hand the dashboard's own (known-good) session token to the embedded page in
  // THREE ways so it can never falsely lock: (1) in the frame's URL hash — the
  // most reliable, needs no cross-frame scripting and is never sent to the server;
  // (2) a postMessage on load; (3) a postMessage on request. iOS Safari restricts
  // localStorage inside iframes, which caused the false "sign in" lock.
  const src = '/features.html?embed=1&theme=dark#t=' + encodeURIComponent(token || '');
  c.innerHTML = '<iframe class="feat-frame" title="Feature checklist"></iframe>';
  const f = c.querySelector('.feat-frame');
  if (f) { f.addEventListener('load', () => { try { f.contentWindow.postMessage({ type: 'atwe-admin-token', token }, location.origin); } catch (e) {} }); f.src = src; }
}
window.addEventListener('message', (e) => {

/* ─── Feature Controls (module-level kill switches) ─── */
let CONTROLS = { controls: {}, meta: [] };
let _fcSearch = '';
function renderFeatureControlsView(){
  document.getElementById('stats').innerHTML = '';
  document.getElementById('content').innerHTML = '<div class="ld"><span class="ab-mark"></span></div>';
  loadControls();
}
async function loadControls(){
  try { CONTROLS = await api('GET', '/api/admin/feature-controls'); renderControls(); }
  catch (e) { document.getElementById('content').innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; }
}
function fcIsOn(key){ return (CONTROLS.controls || {})[key] !== false; }
function renderControls(){
  const meta = CONTROLS.meta || [];
  const total = meta.length;
  const off = meta.filter(f => !fcIsOn(f.key)).length;
  const q = _fcSearch.trim().toLowerCase();
  // group by category, preserving first-seen order
  const cats = []; const byCat = {};
  meta.forEach(f => { if (!byCat[f.cat]) { byCat[f.cat] = []; cats.push(f.cat); } byCat[f.cat].push(f); });
  let html = ''
    + '<div class="fc-head">'
    +   '<div class="fc-intro"><b>Feature Controls.</b> Turn any of your live features off across the whole app — the moment you do, anyone who opens it sees <b>“Unavailable.”</b> Everything defaults to <span style="color:var(--accent)">Active</span>. Money features are also blocked on the server when off.</div>'
    +   '<div class="fc-stat"><span class="fc-num">' + (total - off) + '</span> active · <span class="fc-num" style="color:var(--danger)">' + off + '</span> off · ' + total + ' total</div>'
    + '</div>'
    + '<input class="fc-search" id="fcSearch" placeholder="Search features…" value="' + esc(_fcSearch) + '" oninput="fcOnSearch(this.value)"/>';
  cats.forEach(cat => {
    const items = byCat[cat].filter(f => !q || (f.label + ' ' + f.cat).toLowerCase().includes(q));
    if (!items.length) return;
    const onCount = items.filter(f => fcIsOn(f.key)).length;
    const allOff = onCount === 0;
    html += '<div class="fc-cat">'
      + '<div class="fc-cat-head"><div class="fc-cat-name">' + esc(cat) + ' <span class="fc-cat-count">' + onCount + '/' + items.length + ' on</span></div>'
      + '<button class="fc-catbtn" onclick="toggleControlCategory(' + JSON.stringify(cat).replace(/"/g,'&quot;') + ',' + (allOff ? 'true' : 'false') + ')">' + (allOff ? 'Turn all on' : 'Turn all off') + '</button></div>';
    items.forEach(f => {
      const on = fcIsOn(f.key);
      html += '<div class="site-row fc-row">'
        + '<div><div class="srt">' + esc(f.label) + (on ? '' : ' <span class="pill ban">off</span>') + '</div><div class="srs">' + esc(f.key) + '</div></div>'
        + '<button class="switch flag ' + (on ? 'on' : '') + '" onclick="toggleControl(' + JSON.stringify(f.key).replace(/"/g,'&quot;') + ')" aria-label="' + esc(f.label) + '"><span></span></button></div>';
    });
    html += '</div>';
  });
  document.getElementById('content').innerHTML = html;
}
function fcOnSearch(v){ _fcSearch = v; const el = document.activeElement; renderControls(); const s = document.getElementById('fcSearch'); if (s) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); } }
async function toggleControl(key){
  const cur = fcIsOn(key); const want = !cur;
  if (!want && !confirm('Turn OFF "' + key + '"? Anyone who opens it will see “Unavailable” until you turn it back on.')) return;
  try {
    const r = await api('PUT', '/api/admin/feature-controls', { controls: { [key]: want } });
    CONTROLS.controls = r.controls; renderControls();
    notify(want ? 'Feature turned on.' : 'Feature turned off.');
  } catch (e) { notify(e.message); }
}
async function toggleControlCategory(cat, want){
  const keys = (CONTROLS.meta || []).filter(f => f.cat === cat).map(f => f.key);
  if (!want && !confirm('Turn OFF every feature in "' + cat + '"? Users will see “Unavailable” for all of them.')) return;
  const patch = {}; keys.forEach(k => patch[k] = want);
  try {
    const r = await api('PUT', '/api/admin/feature-controls', { controls: patch });
    CONTROLS.controls = r.controls; renderControls();
    notify(want ? 'Category turned on.' : 'Category turned off.');
  } catch (e) { notify(e.message); }
}

let VAULT = { parent: null, items: [], path: [], encKey: false };
const VT_IC = {
  folder: '<svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',

  secret: '<svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
};
function renderVaultView(){ document.getElementById('stats').innerHTML=''; document.getElementById('content').innerHTML='<div class="ld"><span class="ab-mark"></span></div>'; loadVault(null); }
async function loadVault(parent){
  VAULT.parent = parent || null;
  try {
    const d = await api('GET', '/api/admin/drive' + (parent ? ('?parent=' + encodeURIComponent(parent)) : ''));
    VAULT.items = d.items || []; VAULT.path = d.path || []; VAULT.encKey = !!d.encryptedKey; renderVault();
  } catch (e) { document.getElementById('content').innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; }
}
function vtSize(n){ n = +n || 0; if (n < 1024) return n + ' B'; if (n < 1048576) return (n/1024).toFixed(1) + ' KB'; return (n/1048576).toFixed(1) + ' MB'; }
function renderVault(){
  const crumbs = ['<span class="vt-crumb" onclick="loadVault(null)">Vault</span>']
    .concat(VAULT.path.map(p => `<span class="vt-sep">›</span><span class="vt-crumb" onclick="loadVault('${p.id}')">${esc(p.name)}</span>`)).join('');
  const folders = VAULT.items.filter(i => i.kind === 'folder');
  const files = VAULT.items.filter(i => i.kind === 'file');
  const secrets = VAULT.items.filter(i => i.kind === 'secret');
  const row = (it) => {
    const click = it.kind === 'folder' ? `loadVault('${it.id}')` : (it.kind === 'file' ? `vaultDownload('${it.id}')` : `vaultReveal('${it.id}')`);
    const sub = it.kind === 'file' ? vtSize(it.size_bytes) : (it.kind === 'secret' ? 'Secret · tap to reveal' : 'Folder');
    return `<div class="vt-row" onclick="${click}">
      <span class="vt-ic vt-${it.kind}">${VT_IC[it.kind]}</span>
      <div class="vt-main"><div class="vt-name">${esc(it.name)}</div><div class="vt-sub">${sub}${it.note ? ' · ' + esc(it.note) : ''}</div></div>
      <button class="vt-act" onclick="event.stopPropagation();vaultRename('${it.id}')" aria-label="Rename" title="Rename">✎</button>
      <button class="vt-act vt-del" onclick="event.stopPropagation();vaultDelete('${it.id}')" aria-label="Delete" title="Delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button>
    </div>`;
  };
  const empty = !VAULT.items.length ? '<div class="empty" style="padding:34px 0">This folder is empty. Upload files, create a folder, or add a secret.</div>' : '';
  document.getElementById('content').innerHTML = `
    <div class="vt-note">🔒 Private to you (admin only). Files and secrets are <b>encrypted at rest</b> (AES-256-GCM) and only ever sent over HTTPS. ${VAULT.encKey ? '' : 'Set a <code>DRIVE_KEY</code> env var for a dedicated encryption key.'}</div>
    <div class="vt-bar">
      <div class="vt-crumbs">${crumbs}</div>
      <div class="vt-tools">
        <button class="vt-tbtn" onclick="vaultNewFolder()">＋ Folder</button>
        <button class="vt-tbtn" onclick="document.getElementById('vtFiles').click()">⤒ Upload files</button>
        <button class="vt-tbtn" onclick="document.getElementById('vtFolder').click()">⤒ Upload folder</button>
        <button class="vt-tbtn" onclick="vaultAddSecret()">🔑 Add secret</button>
      </div>
    </div>
    <div id="vtProgress" class="vt-progress" style="display:none"></div>
    <div class="vt-list">${folders.map(row).join('')}${files.map(row).join('')}${secrets.map(row).join('')}${empty}</div>
    <input type="file" id="vtFiles" multiple style="display:none" onchange="vaultUploadFiles(this.files)"/>
    <input type="file" id="vtFolder" webkitdirectory style="display:none" onchange="vaultUploadFiles(this.files)"/>`;

function vaultNewFolder(){ const name = prompt('New folder name:'); if (!name) return; api('POST','/api/admin/drive/folder',{ name, parentId: VAULT.parent }).then(()=>loadVault(VAULT.parent)).catch(e=>notify(e.message)); }
function vaultAddSecret(){
  const name = prompt('Secret name (e.g. "Stripe API key"):'); if (!name) return;
  const value = prompt('Value (password / API key). It will be encrypted:'); if (!value) return;
  const note = prompt('Optional note (not secret):') || '';
  api('POST','/api/admin/drive/secret',{ name, value, note, parentId: VAULT.parent }).then(()=>{ notify('Secret saved (encrypted).'); loadVault(VAULT.parent); }).catch(e=>notify(e.message));
}
function readAsDataURL(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); }); }
async function vaultUploadFiles(files){
  files = [...files]; if (!files.length) return;
  const prog = document.getElementById('vtProgress'); if (prog) prog.style.display = 'block';
  let done = 0, failed = 0;
  for (const f of files) {
    if (prog) prog.textContent = `Uploading ${done + 1} of ${files.length}: ${f.name}…`;
    try {
      if (f.size > 18 * 1024 * 1024) { failed++; done++; continue; }
      const dataUrl = await readAsDataURL(f);
      await api('POST','/api/admin/drive/upload',{ name: f.name, parentId: VAULT.parent, mime: f.type, data: dataUrl, path: f.webkitRelativePath || '' });
    } catch (e) { failed++; }
    done++;
  }
  if (prog) prog.style.display = 'none';
  notify(failed ? (`Uploaded ${files.length - failed}, ${failed} failed (over 18 MB?).`) : `Uploaded ${files.length} file${files.length>1?'s':''}.`);
  loadVault(VAULT.parent);
}
async function vaultDownload(id){
  try {
    const res = await fetch('/api/admin/drive/file/' + id, { headers: { Authorization: 'Bearer ' + token } });
    if (!res.ok) throw new Error('Download failed.');
    const it = VAULT.items.find(x => x.id === id);
    const blob = await res.blob(); const url = URL.createObjectURL(blob); const a = document.createElement('a');
    a.href = url; a.download = (it && it.name) || 'file'; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 800);
  } catch (e) { notify(e.message); }
}
async function vaultReveal(id){
  try { const d = await api('GET','/api/admin/drive/secret/' + id); const it = VAULT.items.find(x => x.id === id); vaultShowSecret((it && it.name) || 'Secret', d.value); }

    <textarea class="vt-secret-val" readonly>${esc(value)}</textarea>
    <div class="vt-modal-btns"><button class="vt-tbtn" onclick="vaultCopySecret()">Copy</button><button class="vt-tbtn" onclick="document.getElementById('vtSecretModal').remove()">Close</button></div>
  </div>`;

}
function vaultCopySecret(){ const t = document.querySelector('#vtSecretModal .vt-secret-val'); if (!t) return; t.select(); try { navigator.clipboard.writeText(t.value); } catch(e){ document.execCommand('copy'); } notify('Copied to clipboard.'); }
function vaultRename(id){ const it = VAULT.items.find(x => x.id === id); const name = prompt('Rename:', it ? it.name : ''); if (!name) return; api('PATCH','/api/admin/drive/' + id, { name }).then(()=>loadVault(VAULT.parent)).catch(e=>notify(e.message)); }
function vaultDelete(id){ const it = VAULT.items.find(x => x.id === id); const what = it ? (it.kind === 'folder' ? 'the folder “' + it.name + '” and everything in it' : '“' + it.name + '”') : 'this item'; if (!confirm('Delete ' + what + '? This cannot be undone.')) return; api('DELETE','/api/admin/drive/' + id).then(()=>loadVault(VAULT.parent)).catch(e=>notify(e.message)); }

function relTime(ms){
  if (ms == null) return 'never';
  const s = Math.round(ms/1000);
  if (s < 60) return s+'s ago';
  const m = Math.round(s/60); if (m < 60) return m+'m ago';
  const h = Math.round(m/60); if (h < 48) return h+'h ago';
  return Math.round(h/24)+'d ago';
}
function jobEvery(ms){
  if (ms < 60000) return Math.round(ms/1000)+' s';
  const m = Math.round(ms/60000);
  if (m < 60) return m+' min';
  const h = m/60; return (h % 1 === 0 ? h : h.toFixed(1))+' h';
}

/* ── Site-lock allowlist: the people who skip the code entirely ──

   shown as a Guest with wherever they are, because a page view records nothing

let ONLINE = null;
function onAgo(iso){
  const s = Math.max(0, Math.round((Date.now() - new Date(iso)) / 1000));

  return Math.round(s / 3600) + 'h ago';
}

  return `<span class="on-ava${m.accountType === 'business' ? ' biz' : ''} noimg">${ON_PERSON}</span>`;

function onMemberRow(m){

function tfNum(n){ return (n||0).toLocaleString(); }
function tfChange(cur, prev){
  if (!prev) return cur > 0 ? { txt: '▲ new', cls: 'up' } : { txt: '—', cls: 'flat' };
  const d = Math.round((cur - prev) / prev * 100);
  if (d > 0) return { txt: '▲ ' + d + '%', cls: 'up' };
  if (d < 0) return { txt: '▼ ' + Math.abs(d) + '%', cls: 'down' };
  return { txt: 'no change', cls: 'flat' };
}
function tfBucketLabel(iso, bucket){
  const d = new Date(iso);
  if (bucket === 'hour') return String(d.getHours()).padStart(2,'0');

async function loadAudit(){

async function loadBlocklists(){
  try {
    const d = await api('GET', '/api/admin/moderation-lists');
    const t = document.getElementById('blkTerms'), dm = document.getElementById('blkDomains');
    if (t) t.value = (d.terms||[]).join('\n');
    if (dm) dm.value = (d.domains||[]).join('\n');
    const c = document.getElementById('blkCount'); if (c) c.textContent = (d.terms||[]).length + ' words · ' + (d.domains||[]).length + ' domains';
  } catch (e){ /* leave empty */ }
}
async function saveBlocklists(){
  const split = s => (s||'').split('\n').map(x=>x.trim()).filter(Boolean);
  const terms = split((document.getElementById('blkTerms')||{}).value);
  const domains = split((document.getElementById('blkDomains')||{}).value);
  try {
    const d = await api('PUT', '/api/admin/moderation-lists', { terms, domains });
    const c = document.getElementById('blkCount'); if (c) c.textContent = (d.terms||[]).length + ' words · ' + (d.domains||[]).length + ' domains';
    // Reflect the server's normalized/deduped result back into the boxes.
    document.getElementById('blkTerms').value = (d.terms||[]).join('\n');
    document.getElementById('blkDomains').value = (d.domains||[]).join('\n');
    notify('Blocklists saved.');
  } catch (e){ notify(e.message); }
}
function invSetType(t){ INV_TYPE = t; document.querySelectorAll('#content .tf-r').forEach(b=>b.classList.toggle('on', b.textContent===(INV_TYPES.find(x=>x[0]===t)||[])[1])); invSearch((document.getElementById('invQ')||{}).value||''); }
function invSearch(v){ clearTimeout(_invT); _invT = setTimeout(()=>invRun(v.trim()), 300); }
async function invRun(q){

let MOD = { scanId: null, poll: null, status: 'open' };
const MOD_SCOPES = [['full','Everything'],['posts','Posts'],['groups','Groups'],['listings','Listings'],['profiles','Profiles'],['ads','Ads']];
const MOD_CAT_LABEL = { harassment:'Abuse / harassment', hate:'Hate speech', violence:'Violence / threats', sexual:'Pornography / sexual', underage:'Underage / CSAM', prostitution:'Prostitution', drugs:'Illegal drugs', scam:'Scam / fraud', spam:'Spam', illegal:'Illegal activity', privacy:'Privacy / doxxing', other:'Other' };

function modSetStatus(s){ MOD.status = s; ['Open','Actioned','Dismissed'].forEach(k=>{const b=document.getElementById('modTab'+k);if(b)b.classList.toggle('on', k.toLowerCase()===s);}); modLoadFlags(); }
async function modStartScan(scope, opts){
  const btn = document.getElementById('modScanBtn'); if (btn) btn.disabled = true;
  const prog = document.getElementById('modProgress');
  if (prog) prog.innerHTML = '<div class="mod-prog"><span class="mod-spin"></span> Starting scan…</div>';
  try {
    const d = await api('POST', '/api/admin/moderation/scan', Object.assign({ scope }, opts||{}));
    MOD.scanId = d.scanId;
    modPoll();
  } catch (e) { if (prog) prog.innerHTML = '<div class="mod-prog err">'+esc(e.message||'Could not start.')+'</div>'; if (btn) btn.disabled = false; }
}
function modScanTarget(kind){
  const v = (document.getElementById('modTarget').value||'').trim();
  if (!v) { alert('Enter a username or group id.'); return; }
  if (kind === 'user') modStartScan('user', { username: v.replace(/^@/,'') });
  else modStartScan('group', { groupId: parseInt(v,10) });
}
async function modPoll(){
  clearTimeout(MOD.poll);
  try {
    const { scan } = await api('GET', '/api/admin/moderation/scan/' + MOD.scanId);
    const prog = document.getElementById('modProgress');
    const aiTag = scan.ai ? '' : ' · heuristic only (set ANTHROPIC_API_KEY for full AI)';
    if (scan.status === 'running') {
      if (prog) prog.innerHTML = `<div class="mod-prog"><span class="mod-spin"></span> Scanning <b>${esc(scan.label||'')}</b> — ${scan.scanned} checked · <b>${scan.flagged}</b> flagged</div>`;
      MOD.poll = setTimeout(modPoll, 1200);
    } else {
      const btn = document.getElementById('modScanBtn'); if (btn) btn.disabled = false;
      if (prog) prog.innerHTML = `<div class="mod-prog done">✓ Scan of <b>${esc(scan.label||'')}</b> complete — ${scan.scanned} items checked, <b>${scan.flagged}</b> flagged${aiTag}</div>`;
      MOD.status = 'open'; modSetStatus('open');
    }
  } catch (e) { const prog = document.getElementById('modProgress'); if (prog) prog.innerHTML = '<div class="mod-prog err">'+esc(e.message||'Scan error')+'</div>'; }

async function modLoadFlags(){
  const el = document.getElementById('modFlags'); if (!el) return;
  el.innerHTML = '<div class="ld"><span class="ab-mark"></span></div>';
  try {
    const { flags } = await api('GET', '/api/admin/moderation/flags?status=' + MOD.status);
    if (!flags.length) { el.innerHTML = `<div class="empty">${MOD.status==='open'?'No open flags — you\'re clean. Run a scan above.':'Nothing here.'}</div>`; return; }
    el.innerHTML = flags.map(modFlagCard).join('');
  } catch (e) { el.innerHTML = '<div class="empty">'+esc(e.message)+'</div>'; }
}
function modFlagCard(f){
  const sev = f.severity||'medium';
  const owner = f.owner ? `@${esc(f.owner.username||('#'+f.owner.id))}` : 'unknown';
  const ownerStatus = f.owner && f.owner.status && f.owner.status!=='active' ? `<span class="mod-ustatus ${f.owner.status}">${f.owner.status}</span>` : '';
  const grp = f.group ? ` · in <b>${esc(f.group.name||('group #'+f.group.id))}</b>` : '';
  const actions = f.status==='open' ? `<div class="mod-acts">
      <button class="mod-act" onclick="modAction(${f.id},'warn')">Warn</button>
      <button class="mod-act warn" onclick="modAction(${f.id},'suspend')">Suspend</button>
      <button class="mod-act danger" onclick="modAction(${f.id},'ban')">Ban</button>
      <button class="mod-act" onclick="modAction(${f.id},'delete')">Delete content</button>
      <button class="mod-act ghost" onclick="modAction(${f.id},'dismiss')">Dismiss</button>
    </div>` : `<div class="mod-resolved">${f.status==='actioned'?'✓ Actioned':'Dismissed'}</div>`;
  return `<div class="mod-flag sev-${sev}">
    <div class="mod-flag-top">
      <span class="mod-sev ${sev}">${sev}</span>
      <span class="mod-cat">${esc(MOD_CAT_LABEL[f.category]||f.category||'other')}</span>
      <span class="mod-kind">${esc(f.kind.replace('_',' '))}</span>
      <span class="mod-owner"${f.owner?` onclick="openUser(${f.owner.id})" style="cursor:pointer;"`:''}>${owner}${ownerStatus}</span>${grp}
    </div>
    <div class="mod-reason">${esc(f.reason||'')}</div>
    <div class="mod-excerpt">${esc(f.excerpt||'')}</div>
    ${actions}</div>`;
}
async function modAction(id, action){
  let body = { action };
  if (action === 'ban') { if (!confirm('Permanently ban this account? They will be logged out and blocked from signing in.')) return; }
  else if (action === 'suspend') { const days = prompt('Suspend for how many days?', '7'); if (days===null) return; body.days = parseInt(days,10)||7; }
  else if (action === 'delete') { if (!confirm('Delete this content? This cannot be undone.')) return; }
  else if (action === 'warn') { const msg = prompt('Warning message to send the user:', 'Your content was flagged for violating our community guidelines. Please review and keep Atwe professional.'); if (msg===null) return; body.message = msg; }
  try {
    await api('POST', '/api/admin/moderation/flags/' + id + '/resolve', body);
    modLoadFlags();
  } catch (e) { alert(e.message || 'Could not apply the action.'); }
}

/* ─── Fraud rules ─── */
let FR = { rules: [], hits: [], conditions: [], actions: [] };
const FR_ACTION_HELP = {
  flag: 'Let it through, but write it down.',
  block: 'Refuse the payment and tell them to contact support.',
  freeze: 'Refuse it AND freeze the wallet for a person to look at.',
};
function renderFraudView(){
  document.getElementById('stats').innerHTML = '';
  document.getElementById('content').innerHTML = '<div class="ld"><span class="ab-mark"></span></div>';
  loadFraud();
}
async function loadFraud(){
  try { FR = await api('GET', '/api/admin/fraud-rules'); renderFraud(); }
  catch (e){ document.getElementById('content').innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; }
}
function frCondLabel(key){ const c = (FR.conditions||[]).find(x => x.key === key); return c ? c.label : key; }
function frCondValue(key, v){
  const c = (FR.conditions||[]).find(x => x.key === key);
  if (!c) return String(v);
  if (c.unit === 'money') return '$' + (Number(v)/100).toLocaleString();
  if (c.unit === 'flag') return '';
  return String(v) + ' ' + c.unit;
}
function renderFraud(){
  if (VIEW !== 'fraud') return;
  const rows = (FR.rules || []).map(r => {
    const conds = Object.entries(r.conditions || {}).map(([k, v]) =>
      '<div class="fr-cond">' + esc(frCondLabel(k)) + ' <b>' + esc(frCondValue(k, v)) + '</b></div>').join('');
    return `<div class="ref-row"><div class="ref-main">
      <div class="ref-top"><span class="ref-kind">${esc(r.name)}</span>
        <span class="pill ${r.action==='freeze'?'ban':(r.action==='block'?'susp':'')}">${esc(r.action)}</span>
        ${r.enabled ? '' : '<span class="pill">paused</span>'}
        ${r.hits ? '<span class="muted">' + r.hits + ' hit' + (r.hits===1?'':'s') + '</span>' : ''}</div>
      <div class="ref-sub">${esc(FR_ACTION_HELP[r.action] || '')}</div>
      <div class="fr-conds">${conds || '<span class="muted">no conditions</span>'}</div>
    </div><div class="ref-side"><div class="ref-acts">
      <button class="act" onclick="frToggle(${r.id}, ${r.enabled ? 'false' : 'true'})">${r.enabled ? 'Pause' : 'Turn on'}</button>
      <button class="act danger" onclick="frDelete(${r.id})">Delete</button>
    </div></div></div>`;
  }).join('') || '<div class="empty">No rules yet. The standard velocity caps still apply to everyone.</div>';

  const condInputs = (FR.conditions || []).map(c => c.unit === 'flag'
    ? `<label class="ovp-item"><input type="checkbox" id="frc-${c.key}"/><span>${esc(c.label)}</span></label>`
    : `<div class="fr-in"><label>${esc(c.label)}${c.unit === 'money' ? ' ($)' : ''}</label>
        <input class="in" id="frc-${c.key}" type="number" min="0" step="${c.unit === 'money' ? '1' : '1'}" placeholder="—" style="margin:0;"/></div>`
  ).join('');

  const hits = (FR.hits || []).slice(0, 30).map(h => `<div class="ref-row"><div class="ref-main">
      <div class="ref-top"><span class="ref-kind">${esc(h.rule_name || 'deleted rule')}</span>
        <span class="pill ${h.action==='freeze'?'ban':(h.action==='block'?'susp':'')}">${esc(h.action)}</span></div>
      <div class="ref-sub">${h.username ? '@'+esc(h.username) : 'account #' + h.user_id} · ${h.amount_cents != null ? money(h.amount_cents) : '—'} · ${new Date(h.created_at).toLocaleString()}</div>
    </div></div>`).join('') || '<div class="empty">No rule has fired yet.</div>';

  document.getElementById('content').innerHTML = `
    <div class="panel"><h3>Your own fraud rules</h3>
      <div class="sub">The standard limits are one blunt number for everyone. A rule lets you say the specific thing you mean — <b>"a brand-new account trying to send $500"</b> — and choose what happens: write it down, refuse the payment, or freeze the wallet for a person to look at. Every condition on a rule must be true at once. Rules run on every payment leaving a wallet, and a broken rule never stops someone spending their own money.</div>
    </div>
    <div class="panel"><h3>Add a rule</h3>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;">
        <input class="in" id="frName" maxlength="80" placeholder="Rule name (e.g. New account, big send)" style="flex:1;min-width:220px;margin:0;"/>
        <select class="in" id="frAction" style="width:170px;margin:0;">
          <option value="flag">Just record it</option>
          <option value="block">Refuse the payment</option>
          <option value="freeze">Refuse &amp; freeze wallet</option>
        </select>
      </div>
      <div class="sub" style="margin-bottom:8px;">Fires when <b>all</b> of these are true. Leave a box empty to ignore it.</div>
      <div class="fr-grid">${condInputs}</div>
      <button class="act accent" style="margin-top:12px;" onclick="frCreate()">Create rule</button>
    </div>
    <div class="panel"><h3>Try it against a real account</h3>
      <div class="sub">A dry run — nothing is charged, frozen or recorded.</div>
      <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;">
        <input class="in" id="frTestUser" placeholder="@username" style="flex:1;min-width:160px;margin:0;"/>
        <input class="in" id="frTestAmt" type="number" placeholder="amount $" style="width:130px;margin:0;"/>
        <button class="act" onclick="frTest()">Test</button>
      </div>
      <div id="frTestOut" class="sub" style="margin-top:10px;"></div>
    </div>
    <div class="panel"><h3>Live rules</h3></div>${rows}
    <div class="panel"><h3>Recently fired</h3></div>${hits}`;
}
function frReadConditions(){
  const out = {};
  for (const c of (FR.conditions || [])) {
    const el = document.getElementById('frc-' + c.key); if (!el) continue;
    if (c.unit === 'flag') { if (el.checked) out[c.key] = true; continue; }
    const v = el.value.trim(); if (v === '') continue;
    const n = Number(v); if (!Number.isFinite(n) || n < 0) continue;
    out[c.key] = c.unit === 'money' ? Math.round(n * 100) : Math.round(n);
  }
  return out;
}
async function frCreate(){
  const name = (document.getElementById('frName').value || '').trim();
  const action = document.getElementById('frAction').value;
  const conditions = frReadConditions();
  if (!name) { notify('Give the rule a name.'); return; }
  if (!Object.keys(conditions).length) { notify('Add at least one condition — a rule with none would match every payment.'); return; }
  try { await api('POST', '/api/admin/fraud-rules', { name, action, conditions }); notify('Rule created.'); loadFraud(); }
  catch (e){ notify(e.message); }
}
async function frToggle(id, enabled){
  try { await api('PATCH', '/api/admin/fraud-rules/' + id, { enabled }); loadFraud(); } catch (e){ notify(e.message); }
}
async function frDelete(id){
  if (!confirm('Delete this rule? Payments it was catching will go through again.')) return;
  try { await api('DELETE', '/api/admin/fraud-rules/' + id); loadFraud(); } catch (e){ notify(e.message); }
}
async function frTest(){
  const username = (document.getElementById('frTestUser').value || '').trim();
  const amt = Number(document.getElementById('frTestAmt').value);
  const out = document.getElementById('frTestOut');
  if (!username) { notify('Enter a @username.'); return; }
  out.textContent = 'Testing…';
  try {
    const r = await api('POST', '/api/admin/fraud-rules/test', { username, amountCents: Math.round((amt||0)*100) });
    out.innerHTML = r.matched.length
      ? 'Would fire: ' + r.matched.map(m => '<b>' + esc(m.name) + '</b> (' + esc(m.action) + ')').join(', ')
      : 'No rule would fire for that payment.';
  } catch (e){ out.textContent = e.message; }
}

let BC = { broadcasts: [], audiences: [] }, BC_FILTER = '';

async function loadBroadcasts(){

  catch (e){ document.getElementById('content').innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; }
}
function bcFilter(f){ BC_FILTER = f; loadBroadcasts(); }
function renderBroadcasts(){
  if (VIEW !== 'broadcasts') return;
  const rows = (BC.broadcasts || []).map(b => {
    const waiting = b.status === 'draft' || b.status === 'scheduled';
    const acts = waiting
      ? `<div class="ref-acts">
          <button class="act accent" onclick="bcSend(${b.id})">Send now</button>
          <button class="act danger" onclick="bcCancel(${b.id})">Discard</button></div>`
      : `<span class="pill ${b.status==='sent'?'pro':''}">${esc(b.status)}</span>`;
    const when = b.status === 'sent'
      ? 'Sent ' + new Date(b.sentAt).toLocaleString() + ' · ' + (b.recipients||0) + ' people'
        + (b.emailed ? ', ' + b.emailed + ' emailed' : '') + (b.pushed ? ', ' + b.pushed + ' pushed' : '')
      : b.sendAt ? 'Goes out ' + new Date(b.sendAt).toLocaleString()
      : 'Draft · saved ' + new Date(b.createdAt).toLocaleString();
    return `<div class="ref-row"><div class="ref-main">
      <div class="ref-top"><span class="ref-kind">${esc(b.subject || 'No subject')}</span>

        ${b.byEmail ? '<span class="pill">email</span>' : ''}${b.byPush ? '<span class="pill">push</span>' : ''}</div>
      <div class="ref-sub">${esc(when)}</div>
      <div class="ref-reason">${esc((b.body||'').slice(0,200))}</div>
    </div><div class="ref-side">${acts}</div></div>`;
  }).join('') || '<div class="empty">Nothing saved yet.</div>';
  document.getElementById('content').innerHTML = `
    <div class="panel"><h3>Write it now, send it when you mean to</h3>
      <div class="sub">A broadcast reaches every member you pick — in the app, and by email or push if you choose. Save it as a draft and sleep on it, or set a time and let it go out on its own. Once it has gone, it can't be edited: the words are already in people's inboxes.</div>
      <input class="in" id="bcSubject" maxlength="160" placeholder="Subject (used as the email subject)" style="width:100%;margin:10px 0 8px;"/>
      <textarea class="in" id="bcBody" rows="5" maxlength="4000" placeholder="What do you want to say?" style="width:100%;box-sizing:border-box;resize:vertical;"></textarea>
      <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center;">
        <select class="in" id="bcAudience" style="width:170px;margin:0;">
          ${(BC.audiences||['all']).map(a => `<option value="${esc(a)}">${esc(a)}</option>`).join('')}
        </select>
        <label class="ovp-item"><input type="checkbox" id="bcEmail" checked/><span>Also email</span></label>
        <label class="ovp-item"><input type="checkbox" id="bcPush"/><span>Also push</span></label>
        <input class="in" id="bcWhen" type="datetime-local" style="width:220px;margin:0;"/>
      </div>
      <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;">
        <button class="act" onclick="bcSave(false)">Save as draft</button>
        <button class="act accent" onclick="bcSave(true)">Schedule it</button>
      </div>

      <button class="tf-r ${BC_FILTER==='draft'?'on':''}" onclick="bcFilter('draft')">Drafts</button>
      <button class="tf-r ${BC_FILTER==='scheduled'?'on':''}" onclick="bcFilter('scheduled')">Scheduled</button>
      <button class="tf-r ${BC_FILTER==='sent'?'on':''}" onclick="bcFilter('sent')">Sent</button>
    </div></div>${rows}`;
}
async function bcSave(schedule){
  const body = (document.getElementById('bcBody').value || '').trim();
  if (!body) { notify('Write a message first.'); return; }
  const whenRaw = (document.getElementById('bcWhen').value || '').trim();
  if (schedule && !whenRaw) { notify('Pick a date and time, or save it as a draft.'); return; }
  const payload = {
    body, subject: (document.getElementById('bcSubject').value || '').trim(),
    audience: document.getElementById('bcAudience').value,
    byEmail: document.getElementById('bcEmail').checked,
    byPush: document.getElementById('bcPush').checked,
  };
  // datetime-local has no timezone; the browser's own Date reads it as local,
  // which is what the person typing it meant.
  if (schedule) payload.sendAt = new Date(whenRaw).toISOString();
  try {
    await api('POST', '/api/admin/broadcasts', payload);
    document.getElementById('bcBody').value = ''; document.getElementById('bcSubject').value = '';
    document.getElementById('bcWhen').value = '';
    notify(schedule ? 'Scheduled.' : 'Saved as a draft.');
    loadBroadcasts();
  } catch (e){ notify(e.message); }
}
async function bcSend(id){
  if (!confirm('Send this to everyone in that audience now? This cannot be taken back.')) return;
  try { const r = await api('POST', '/api/admin/broadcasts/' + id + '/send', {});
    notify('Sent to ' + r.recipients + ' people.'); loadBroadcasts(); }
  catch (e){ notify(e.message); }
}
async function bcCancel(id){
  if (!confirm('Discard this broadcast?')) return;
  try { await api('DELETE', '/api/admin/broadcasts/' + id); loadBroadcasts(); } catch (e){ notify(e.message); }
}

let APV_FILTER = 'pending', APV_ME = null, APV_CFG = null;
function renderApprovalsView(){
  document.getElementById('stats').innerHTML = '';
  document.getElementById('content').innerHTML = `

      <button class="tf-r ${APV_FILTER==='pending'?'on':''}" onclick="apvFilter('pending')">Waiting</button>

function apvFilter(f){ APV_FILTER = f; renderApprovalsView(); }
async function loadApprovals(){
  const el = document.getElementById('apvBody'); if (!el) return;

        ? (mine

            : `<div class="ref-acts"><button class="act accent" onclick="resolveApproval(${a.id},'approve')">Approve</button><button class="act danger" onclick="resolveApproval(${a.id},'reject')">Reject</button></div>`)
        : `<span class="pill ${a.status==='approved'?'pro':(a.status==='rejected'?'ban':'')}">${esc(a.status)}</span>${a.approved_by_name?' <span class="muted">by '+esc(a.approved_by_name)+'</span>':''}`;

function apvSettingsHtml(c, meta){
  return `<div class="panel">
    <h3>Four-eyes rule <span class="muted">· two people for the dangerous things</span></h3>
    <div class="sub">When this is on, the actions below don't run straight away — they open a request that a <b>different</b> admin has to approve. The standard control in any bank's back office. (Wallet adjustments already work this way and always will.)</div>
    <div class="site-row"><div><div class="srt">Require a second admin${c.enabled?'':' <span class="pill ban">off</span>'}</div><div class="srs">You need at least one other person with dashboard access before this can be switched on.</div></div>
      <button class="switch ${c.enabled?'on':''}" onclick="toggleDual()" aria-label="Four-eyes rule"><span></span></button></div>
    ${(meta||[]).map(m => `<div class="site-row"><div><div class="srt">${esc(m.label)}</div><div class="srs">${esc(m.help)}</div></div>
      <button class="switch ${c.actions[m.key] !== false ? 'on':''}" onclick="toggleDualAction('${m.key}')" aria-label="${esc(m.label)}"><span></span></button></div>`).join('')}
    <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center;">
      <label class="muted" style="font-size:13px;">Refunds count as "large" at $</label>
      <input class="in" id="dualThresh" type="number" min="0" step="1" value="${Math.round((c.refundThresholdCents||0)/100)}" style="width:120px;margin:0;"/>

}
async function toggleDual(){
  const want = !(APV_CFG && APV_CFG.enabled);
  try {
    const r = await api('PUT', '/api/admin/dual-approval', { config: { ...APV_CFG, enabled: want } });
    APV_CFG = r.config; loadApprovals();
    notify(want ? 'Four-eyes rule is on.' : 'Four-eyes rule is off.');
  } catch (e){ notify(e.message); }
}
async function toggleDualAction(key){
  const actions = { ...(APV_CFG && APV_CFG.actions) };
  actions[key] = actions[key] === false;
  try { const r = await api('PUT', '/api/admin/dual-approval', { config: { ...APV_CFG, actions } }); APV_CFG = r.config; loadApprovals(); }
  catch (e){ notify(e.message); }
}
async function saveDualThreshold(){
  const dollars = Number(document.getElementById('dualThresh').value);
  if (!Number.isFinite(dollars) || dollars < 0) { notify('Enter an amount.'); return; }
  try { const r = await api('PUT', '/api/admin/dual-approval', { config: { ...APV_CFG, refundThresholdCents: Math.round(dollars*100) } }); APV_CFG = r.config; notify('Saved.'); loadApprovals(); }
  catch (e){ notify(e.message); }
}
async function resolveApproval(id, action){
  const note = prompt(action === 'approve' ? 'Optional note:' : 'Why are you rejecting this?', '');

  try { await api('POST', '/api/admin/approvals/' + id + '/' + action, { note: note || null });
    notify(action === 'approve' ? 'Approved — the person who asked can now carry it out.' : 'Rejected.'); loadApprovals(); }
  catch (e){ notify(e.message); }
}

async function loadDmca(){
  const el = document.getElementById('dmcaBody'); if (!el) return;
  try {
    const d = await api('GET', '/api/admin/dmca?status=' + DMCA_FILTER);
    if (!d.claims.length) { el.innerHTML = '<div class="empty">No ' + (DMCA_FILTER === 'all' ? '' : DMCA_FILTER + ' ') + 'copyright claims.</div>'; return; }

      const acts = (c.status === 'open')
        ? `<div class="ref-acts"><button class="act danger" onclick="resolveDmca(${c.id},'remove')">Remove content</button><button class="act" onclick="resolveDmca(${c.id},'reject')">Reject claim</button></div>`
        : contested
          ? `<div class="ref-acts"><button class="act accent" onclick="resolveDmca(${c.id},'reinstate')">Put it back</button><button class="act danger" onclick="resolveDmca(${c.id},'remove')">Keep it down</button></div>`
          : `<span class="pill ${c.status==='removed'?'ban':(c.status==='reinstated'?'pro':'')}">${esc(c.status)}</span>${c.handled_by_name?' <span class="muted">by '+esc(c.handled_by_name)+'</span>':''}`;
      return `<div class="ref-row"><div class="ref-main">
        <div class="ref-top"><span class="ref-kind">${esc(c.targetLabel)} #${c.target_id}</span> ${contested?'<span class="pill susp">contested</span>':''} ${c.gone?'<span class="pill">already gone</span>':''}</div>

  try { await api('POST', '/api/admin/dmca/' + id + '/resolve', { action, note: note || null }); notify('Done.'); loadDmca(); }

async function loadRefunds(){
  const el = document.getElementById('refBody'); if (!el) return;
  try {
    const q = REF_FILTER ? ('?status=' + REF_FILTER) : (REF_FILTER === '' ? '?status=open' : '');

      const actions = r.status === 'open'
        ? `<div class="ref-acts"><button class="act accent" onclick="resolveRefund(${r.id}, 'approve', ${r.amount_cents})">Approve · refund ${money(r.amount_cents)}</button><button class="act danger" onclick="resolveRefund(${r.id}, 'decline')">Decline</button></div>`
        : `<span class="pill ${r.status==='approved'?'pro':''}">${esc(r.status)}${r.status==='approved'&&r.refunded_cents?' · '+money(r.refunded_cents):''}</span>${r.resolved_by_name?' <span class="muted">by '+esc(r.resolved_by_name)+'</span>':''}`;
      return `<div class="ref-row"><div class="ref-main"><div class="ref-top"><span class="ref-kind">${REF_KIND[r.kind]||esc(r.kind)}</span> <span class="ref-amt">${money(r.amount_cents)}</span></div><div class="ref-sub">${who} · ${new Date(r.created_at).toLocaleString()}</div>${r.reason?`<div class="ref-reason">“${esc(r.reason)}”</div>`:''}${r.resolution_note?`<div class="ref-note">Note: ${esc(r.resolution_note)}</div>`:''}</div><div class="ref-side">${actions}</div></div>`;
    }).join('');
  } catch (e){ el.innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; }

async function resolveRefund(id, action, amountCents){
  if (action === 'approve') { if (!confirm('Approve this refund? ' + money(amountCents) + ' will be credited to the member\'s wallet.')) return; }
  const note = prompt(action === 'approve' ? 'Optional note (shown to the member):' : 'Reason for declining (shown to the member):', '') ;
  if (action === 'decline' && note === null) return;
  try {
    const r = await api('POST', '/api/admin/refunds/' + id + '/resolve', { action, note: note || null });
    if (r && r.needsApproval) { notify(r.error || 'A second admin has to approve a refund this size.'); loadRefunds(); return; }
    notify(action === 'approve' ? 'Refund issued.' : 'Request declined.'); loadRefunds();
  }
  catch (e){ notify(e.message); }
}

function adcPick(input){

// Ticket workflow + canned replies. The inbox is ordered so VIP, business and
// Pro accounts surface first — a paying or flagged member waiting is worse.
let SUP_FILTER = {}, SUP_COUNTS = {};
async function ticketSet(id, patch){
  try { await api('PATCH', '/api/admin/support/' + id, patch); loadSupport(); }
  catch (e){ notify(e.message); }
}
function supFilter(key, val){
  if (SUP_FILTER[key] === val) delete SUP_FILTER[key]; else SUP_FILTER[key] = val;
  syncSupFilters(); loadSupport();
}
// The chip bar lives outside the list, so it needs its own sync after a change.
function syncSupFilters(){
  document.querySelectorAll('#supFilters .bc-aud').forEach((btn) => {
    const m = /supFilter\('([^']+)','([^']+)'\)/.exec(btn.getAttribute('onclick') || '');
    if (m) btn.classList.toggle('on', SUP_FILTER[m[1]] === m[2]);
  });
}
async function openMacros(userId){
  try {
    const { macros } = await api('GET', '/api/admin/macros');
    const list = macros.length ? macros.map(m => `<div class="site-row">
        <div><div class="srt">${esc(m.title)} <span class="muted">used ${m.uses}×</span></div><div class="srs">${esc(m.body.slice(0, 140))}</div></div>
        <div style="display:flex;gap:6px;">
          <button class="act accent" onclick="useMacro(${m.id}, ${userId})">Copy${userId ? ' &amp; message' : ''}</button>
          <button class="act danger" onclick="deleteMacro(${m.id}, ${userId})">Delete</button></div>
      </div>`).join('') : '<div class="muted" style="padding:6px 0;">No saved replies yet.</div>';
    document.getElementById('modalCard').innerHTML = `
      <div class="modal-head"><div><h2>Canned replies</h2><div class="u-email">Most of support is the same handful of answers</div></div><button class="close-x" onclick="closeModal()">&times;</button></div>
      <div style="padding:0 20px 20px;">
        <div style="display:flex;gap:8px;margin-bottom:12px;">

async function saveMacro(userId){
  const title = document.getElementById('macTitle').value.trim();
  const body = document.getElementById('macBody').value.trim();
  if (!title || !body) { notify('Give it a title and a message.'); return; }
  try { await api('POST', '/api/admin/macros', { title, body }); openMacros(userId); }
  catch (e){ notify(e.message); }
}
async function deleteMacro(id, userId){
  try { await api('DELETE', '/api/admin/macros/' + id); openMacros(userId); }
  catch (e){ notify(e.message); }
}
async function useMacro(id, userId){
  try {
    const { macros } = await api('GET', '/api/admin/macros');
    const m = macros.find(x => x.id === id); if (!m) return;
    await api('POST', '/api/admin/macros/' + id + '/used').catch(() => {});
    // With a member attached, send it straight into their in-app inbox.
    if (userId) {
      await api('POST', '/api/admin/users/bulk', { action: 'message', ids: [userId], body: m.body });
      notify('Sent to their Atwe inbox.'); closeModal(); return;
    }
    try { await navigator.clipboard.writeText(m.body); notify('Copied.'); }
    catch (_) { notify('Copy it manually — the browser blocked the clipboard.'); }
  } catch (e){ notify(e.message); }
}

async function sendBroadcast(){
  const inp = document.getElementById('bcInput'), btn = document.getElementById('bcSend');
  const subj = document.getElementById('bcSubject');
  const body = (inp.value || '').trim();
  const subject = (subj.value || '').trim();
  if (!body) { inp.focus(); return; }
  const audLabel = (BC_AUDS.find(x => x.key === (BC_AUD || 'all')) || {});
  if (!confirm(`Send this to ${audLabel.count != null ? audLabel.count : 'all'} member${audLabel.count === 1 ? '' : 's'} (${audLabel.label || 'Everyone'})?`)) return;
  btn.disabled = true;
  try {
    const audience = BC_AUD || 'all';
    const email = document.getElementById('bcEmail').checked;
    const pushIt = document.getElementById('bcPush').checked;
    const { sent, emailing, pushing } = await api('POST', '/api/admin/broadcast', { body, subject, audience, email, push: pushIt });
    inp.value = ''; subj.value = ''; document.getElementById('bcCount').textContent = '0 / 4000';
    notify('Sent to ' + sent + ' inbox' + (sent === 1 ? '' : 'es') + (emailing ? ' · emailing ' + emailing : '') + (pushing ? ' · pushing ' + pushing : '') + '.');
  } catch (e) { notify(e.message); } finally { btn.disabled = false; }
}
// Broadcast audiences: each is a server-side predicate, so the count preview and
// the send always agree. Push is opt-in and only offered when VAPID is set up.
let BC_AUD = 'all', BC_AUDS = [];
async function loadBroadcastAudiences(){
  const box = document.getElementById('bcAudiences'); if (!box) return;
  try {
    const { audiences, pushEnabled } = await api('GET', '/api/admin/broadcast/audiences');
    BC_AUDS = audiences;
    box.innerHTML = audiences.map(a => `<button class="bc-aud${a.key === BC_AUD ? ' on' : ''}" onclick="pickAudience('${a.key}')">${esc(a.label)} <b>${a.count}</b></button>`).join('');
    const pw = document.getElementById('bcPushWrap');
    if (pw && !pushEnabled) { pw.style.opacity = '.5'; pw.title = 'Push isn\'t configured on this server'; document.getElementById('bcPush').disabled = true; }
  } catch (e){ box.innerHTML = '<span class="muted">' + esc(e.message) + '</span>'; }
}
function pickAudience(k){
  BC_AUD = k;

async function dismissSupport(id){

// Trending curation. Every tag the platform saw this week, plus any tag staff
// have already touched (a pinned tag may have no posts of its own yet).
async function loadTrendCuration(){
  const box = document.getElementById('trendBox'); if (!box) return;
  try {
    const { live, overrides } = await api('GET', '/api/admin/trends');
    const ov = new Map(overrides.map(o => [o.tag.toLowerCase(), o]));
    const seen = new Set();
    const rows = [];
    for (const t of live){ seen.add(t.tag.toLowerCase()); rows.push({ tag: t.tag, count: t.count, o: ov.get(t.tag.toLowerCase()) || {} }); }
    for (const o of overrides){ if (!seen.has(o.tag.toLowerCase())) rows.push({ tag: o.tag, count: 0, o }); }
    rows.sort((a, b) => (b.o.pinned ? 1 : 0) - (a.o.pinned ? 1 : 0) || b.count - a.count);
    box.innerHTML = rows.length ? '<div class="panel">' + rows.map(r => {
      const id = r.tag.replace(/[^a-zA-Z0-9]/g, '_');
      return `<div class="site-row tr-row${r.o.hidden ? ' tr-off' : ''}">
        <div style="min-width:0;">
          <div class="srt">#${esc(r.tag)}${r.o.pinned ? ' <span class="pill pro">pinned</span>' : ''}${r.o.hidden ? ' <span class="pill susp">hidden</span>' : ''}</div>
          <div class="srs">${r.count} post${r.count === 1 ? '' : 's'} this week</div>
        </div>
        <input class="in" id="trl_${id}" maxlength="60" value="${esc(r.o.label || '')}" placeholder="Context line (optional)" onkeydown="if(event.key==='Enter')saveTrend(${jstr(r.tag)})" onblur="saveTrend(${jstr(r.tag)})"/>
        <button class="act${r.o.pinned ? ' on' : ''}" onclick="toggleTrend(${jstr(r.tag)}, 'pinned')">${r.o.pinned ? 'Pinned' : 'Pin'}</button>
        <button class="act${r.o.hidden ? ' danger' : ''}" onclick="toggleTrend(${jstr(r.tag)}, 'hidden')">${r.o.hidden ? 'Hidden' : 'Hide'}</button>
      </div>`;
    }).join('') + '</div>' : '<div class="empty">Nothing is trending yet.</div>';
  } catch (e){ box.innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; }
}
// One row's current state, so a toggle never wipes a label typed beside it.
function trendRowState(tag){
  const box = document.getElementById('trendBox');

  const label = (document.getElementById('trl_' + tag.replace(/[^a-zA-Z0-9]/g, '_')) || {}).value || '';

async function pushReach(){

    el.textContent = d.pushEnabled
      ? `Can reach ${d.reachable} of ${d.members} in this group.`

async function sendPush(){

  if (!title || !body) { notify('A title and a line of text are both needed.'); return; }

  try {
    const r = await api('POST', '/api/admin/push-broadcast', { title, body, audience: aud,
      url: document.getElementById('pbUrl').value });

// Downloads need the admin token, so they can't be a plain link.
async function exportTable(kind){
  try {
    const r = await fetch('/api/admin/export2/' + kind, { headers: { Authorization: 'Bearer ' + token } });
    if (!r.ok) throw new Error('Could not build that export.');
    const blob = await r.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'atwe-' + kind + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  } catch (e){ notify(e.message); }
}

async function downloadAudit(days){

async function bulkUsers(action){
  const ids = [...USEL]; if (!ids.length) return;
  const body = { action, ids };
  if (action === 'tag' || action === 'untag') body.tag = document.getElementById('bulkTag').value;
  if (action === 'message') {
    const m = prompt('Message to send to ' + ids.length + ' member' + (ids.length === 1 ? '' : 's') + ':', '');
    if (!m) return; body.body = m;
  }
  if (action === 'suspend') {
    const why = prompt('Suspend ' + ids.length + ' account' + (ids.length === 1 ? '' : 's') + ' — the reason (applies to all of them):', '');
    if (!why || !why.trim()) return;
    const d = parseInt(prompt('For how many days?', '7'), 10);
    body.reason = why.trim(); body.days = (Number.isInteger(d) && d > 0) ? d : 7;
  }
  if (action === 'export') {
    // A download, not JSON — go through fetch so the CSV lands as a file.
    try {
      const res = await fetch('/api/admin/users/bulk', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token }, body: JSON.stringify(body) });
      if (!res.ok) throw new Error('Export failed.');
      const blob = await res.blob(); const url = URL.createObjectURL(blob);
      const link = document.createElement('a'); link.href = url; link.download = 'atwe-users.csv';
      document.body.appendChild(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
      notify('Exported ' + ids.length + '.');
    } catch (e){ notify(e.message); }
    return;
  }
  if (!confirm(action + ' ' + ids.length + ' account' + (ids.length === 1 ? '' : 's') + '?')) return;
  try {
    const r = await api('POST', '/api/admin/users/bulk', body);
    notify('Done — ' + r.affected + ' updated' + (r.skipped ? ' (' + r.skipped + ' skipped: admins / yourself)' : '') + '.');
    clearUserSel(); load();
  } catch (e){ notify(e.message); }
}

function renderChat(){
  const el = document.getElementById('chatScroll');
  if (!el) return;
  if (!DM.messages.length) {
    el.innerHTML = '<div class="chat-empty">No messages yet.<br/>Say hello below.</div>';
    return;
  }
  const SIX_MIN = 6 * 60 * 1000;
  let html = '';
  let lastT = 0, lastDay = '';
  DM.messages.forEach((m, i) => {
    const t = new Date(m.created_at).getTime();
    const day = fmtDate(m.created_at);
    if (day !== lastDay) { html += `<div class="chat-day">${esc(day)}</div>`; lastDay = day; }
    // A bigger gap (or sender switch) starts a fresh group; the last bubble of a
    // group gets the rounded "tail" corner, iMessage-style.
    const prev = DM.messages[i - 1];
    const next = DM.messages[i + 1];
    const grouped = prev && prev.sender === m.sender && (t - lastT) < SIX_MIN;
    const endsGroup = !next || next.sender !== m.sender || (new Date(next.created_at).getTime() - t) >= SIX_MIN;
    const cls = (m.sender === 'admin' ? 'admin' : 'user') + (grouped ? '' : ' gap') + (endsGroup ? ' tail' : '');
    const img = m.image ? `<img class="dm-img" src="${m.image}" alt="" onclick="window.open(this.src,'_blank')"/>` : '';
    const txt = m.body ? esc(m.body) : '';
    const bcls = 'dm-msg' + (m.image && !m.body ? ' photo' : '') + (m.image && m.body ? ' has-cap' : '');
    html += `<div class="dm-row ${cls}"><div class="${bcls}">${img}${txt}</div></div>`;
    lastT = t;
  });
  el.innerHTML = html;
  el.scrollTop = el.scrollHeight;
}

/* Pending photo attachment for the admin composer. */
let _chatImg = null;
function onChatFile(e){
  const file = e.target.files[0];
  e.target.value = '';
  if (!file || !file.type.startsWith('image/')) return;
  if (file.size > 18 * 1024 * 1024) { notify('That image is too large (max 18 MB).'); return; }
  downscaleImage(file, dataUrl => {
    _chatImg = dataUrl;
    document.getElementById('chatImgThumb').src = dataUrl;
    document.getElementById('chatImgPrev').classList.add('show');
  });
}
function clearChatImage(){
  _chatImg = null;
  document.getElementById('chatImgPrev').classList.remove('show');
  document.getElementById('chatImgThumb').src = '';
}
// Read + downscale an image file to a compact JPEG data URL.
function downscaleImage(file, cb){
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      const max = 1400;
      let w = img.width, h = img.height;
      if (w > max || h > max){ const r = Math.min(max / w, max / h); w = Math.round(w * r); h = Math.round(h * r); }
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      try { cb(c.toDataURL('image/jpeg', 0.82)); }
      catch (e) { cb(ev.target.result); }
    };
    img.onerror = () => cb(ev.target.result);
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

async function sendChat(){
  const inp = document.getElementById('chatInput');
  const btn = document.getElementById('chatSend');
  if (!inp || !DM.id) return;
  const body = inp.value.trim();

  btn.disabled = true;
  try {
    const { message } = await api('POST', '/api/admin/users/' + DM.id + '/messages', { body, image: _chatImg });
    DM.messages.push(message);

function autosizeChat(){
  const inp = document.getElementById('chatInput');
  if (!inp) return;
  inp.style.height = 'auto';
  inp.style.height = Math.min(inp.scrollHeight, 130) + 'px';
}

document.addEventListener('keydown', e => {
  if (!(e.target && e.target.id === 'chatInput')) return;

async function setUserStatus(id, status){
  const u = USERS.find(x => x.id === id); if (!u) return;
  const body = { status };
  if (status === 'banned') {
    if (!confirm('Ban ' + u.email + '? They\'ll be locked out permanently and signed out everywhere. Their content stays (use Delete to remove it).')) return;
    body.reason = prompt('Reason for the ban (shown to them at login, optional):', '') || '';
  } else if (status === 'limited') {
    if (!confirm('Limit ' + u.email + '? They can still sign in and read, but can\'t post, message or sell.')) return;
    const d = prompt('Limit for how many days?', '7');
    if (d === null) return;
    body.days = Math.max(1, parseInt(d, 10) || 7);
    body.reason = prompt('Reason (shown to them, optional):', '') || '';
  } else if (status === 'suspended') {
    const days = prompt('Suspend for how many days?', '7');
    if (days === null) return;
    body.days = Math.max(1, parseInt(days, 10) || 7);
    body.reason = prompt('Reason for the suspension (optional):', '') || '';
  }
  try {
    const { user } = await api('POST', '/api/admin/users/' + id + '/status', body);
    merge({ ...user, status: user.status, status_reason: user.status_reason, suspended_until: user.suspended_until });
    notify(status === 'active' ? 'Account reinstated.' : (status === 'banned' ? 'Account banned.' : 'Account suspended.'));
    if (modalOpen()) openUser(id);
  } catch (e) { notify(e.message); }
}

// "View as user" — a logged, time-boxed support impersonation. Opens the app in a
// new tab signed in AS the member (money/email/delete disabled, 45-min token).
async function impersonateUser(id){
  const u = USERS.find(x => x.id === id); if (!u) return;
  if (!confirm('Open ' + (u.username ? '@'+u.username : u.email) + '\'s account to reproduce an issue?\n\nThis is fully logged. Money transfers, email changes and account deletion are disabled while you view it.')) return;
  const reason = prompt('Reason (recorded — e.g. a ticket number):', '') || '';

async function removeUser(id){
  const u = USERS.find(x => x.id === id); if (!u) return;
  if (!confirm('Delete ' + u.email + '? This permanently removes their account, chats and projects.')) return;
  try {
    const r = await api('DELETE', '/api/admin/users/' + id);
    // The four-eyes rule turned this into a request, not a deletion. Once a
    // second admin approves it, pressing Delete again just works.
    if (r && r.needsApproval) { notify(r.error || 'A second admin has to approve this first.'); return; }
    USERS = USERS.filter(x => x.id !== id); closeModal(); render(); notify('User deleted.');
  }
  catch (e) { notify(e.message); }
}

function merge(user){
  const i = USERS.findIndex(x => x.id === user.id);
  if (i >= 0) USERS[i] = { ...USERS[i], ...user };
  render();
}

// Export the current users list to a CSV download (client-side).
function exportUsersCsv(){
  if (!USERS.length) { notify('No users to export.'); return; }
  const cols = ['id', 'name', 'email', 'username', 'plan', 'is_admin', 'email_verified', 'chat_count', 'created_at', 'last_login_at'];
  const cell = (v) => {
    const s = v == null ? '' : String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const rows = [cols.join(',')].concat(USERS.map(u => cols.map(c => cell(u[c])).join(',')));
  const blob = new Blob([rows.join('\n')], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'atwe-users-' + new Date().toISOString().slice(0, 10) + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  notify('Exported ' + USERS.length + ' users.');
}

  c.innerHTML = `
    <div class="stat-grid">
      <div class="stat"><b>${d.average ? d.average.toFixed(2) : '—'}</b><span>average</span></div>
      <div class="stat"><b>${d.total||0}</b><span>reviews</span></div>
      <div class="stat"><b>${d.bad||0}</b><span>one or two stars</span></div>
      <div class="stat"><b>${d.needReply||0}</b><span>worth a reply</span></div>
    </div>
    <div class="card"><div class="card-h">Recent <button class="btn" onclick="refreshAppReviews()">Fetch new ones</button></div>
    ${rows.length ? rows.map(r => `<div class="ad-row">
      <div><b>${'★'.repeat(r.rating||0)}${'☆'.repeat(Math.max(0,5-(r.rating||0)))} ${jstr(r.title||'')}</b>
        <div class="muted">${jstr((r.body||'').slice(0,240))}</div>
        <div class="muted" style="margin-top:4px;">${jstr(r.author||'')} · ${jstr(r.version||'')} · ${jstr(r.territory||'')} · ${r.createdAt?jstr(new Date(r.createdAt).toLocaleDateString()):''}</div>
        ${r.responded ? `<div class="muted" style="margin-top:6px;">Replied: ${jstr((r.response||'').slice(0,200))}</div>` : ''}</div>
      ${r.responded ? '<span class="ad-badge ok">replied</span>'
        : `<button class="btn" onclick="markAppReviewReplied(${jstr(JSON.stringify(r.id))})">Mark replied</button>`}
    </div>`).join('') : '<div class="muted">Nothing yet.</div>'}</div>
    <div class="card"><div class="card-h">Replying</div>
      <div class="muted">Replies have to be posted in App Store Connect — Apple requires a signed key and the
      review-response permission, which is deliberately not something a web dashboard should hold. Reply there,
      then mark it here so nobody answers the same person twice.</div></div>`;
}
async function refreshAppReviews(){
  try { await api('/api/admin/app-reviews?refresh=1'); renderAppReviews(); } catch(e){ alert('Could not fetch.'); }
}
async function markAppReviewReplied(id){
  const txt = prompt('What did you reply? (kept here as a record)');
  if (txt === null) return;
  try { await api('/api/admin/app-reviews/'+encodeURIComponent(id)+'/responded','POST',{response:txt}); renderAppReviews(); }
  catch(e){ alert('Could not save that.'); }
}

/* ─── Advances ─────────────────────────────────────────────────────────────
   Money advanced against sales already made. Off unless deliberately switched
   on, because lending is regulated and a checkbox does not change that. */
async function renderAdvancesAdmin(){
  const c = document.getElementById('content');
  document.getElementById('stats').innerHTML = '';
  c.innerHTML = '<div class="muted">Loading…</div>';
  let d = null;
  try { d = await api('/api/admin/advances'); } catch(e){ c.innerHTML = '<div class="muted">Could not load.</div>'; return; }
  const cfg = d.config || {};
  const rows = d.advances || [];
  c.innerHTML = `
    <div class="card">
      <div class="card-h">Before you switch this on</div>
      <div class="muted">Advancing money against future receipts is a <b>regulated activity</b> in most places.
      The machinery below is built and works. Whether Atwe may lawfully run it where your sellers are is a question
      for a lawyer, not for this page. It stays off until somebody deliberately turns it on.</div>
      <div class="ad-row" style="margin-top:10px;">
        <div><b>Advances are ${cfg.enabled ? 'ON' : 'off'}</b>
          <div class="muted">${cfg.enabled ? 'Sellers with enough history are being offered money.' : 'Nobody is offered anything and the member screen says so.'}</div></div>
        <span class="ad-badge ${cfg.enabled ? 'ok' : ''}">${cfg.enabled ? 'live' : 'off'}</span>
      </div>
    </div>
    <div class="stat-grid">
      <div class="stat"><b>$${((d.advancedCents||0)/100).toFixed(2)}</b><span>advanced</span></div>
      <div class="stat"><b>$${((d.repaidCents||0)/100).toFixed(2)}</b><span>repaid</span></div>
      <div class="stat"><b>${d.active||0}</b><span>outstanding</span></div>
      <div class="stat"><b>$${(((d.advancedCents||0)-(d.repaidCents||0))/100).toFixed(2)}</b><span>still out</span></div>
    </div>
    <div class="card"><div class="card-h">Terms</div>
      <label class="muted">Turn advances on
        <input type="checkbox" id="advOn" ${cfg.enabled?'checked':''}/></label>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;">
        <label class="muted">Most we advance ($)<input class="in" id="advMax" type="number" value="${(cfg.maxCents||0)/100}"/></label>
        <label class="muted">Fee (%)<input class="in" id="advFee" type="number" value="${cfg.feePct||0}"/></label>
        <label class="muted">Share of each sale (%)<input class="in" id="advShare" type="number" value="${cfg.sharePct||0}"/></label>
        <label class="muted">Sales needed first ($)<input class="in" id="advMin" type="number" value="${(cfg.minSalesCents||0)/100}"/></label>
      </div>
      <button class="btn" style="margin-top:10px;" onclick="saveAdvanceCfg()">Save</button>
    </div>
    <div class="card"><div class="card-h">Who has one</div>
    ${rows.length ? rows.map(a => `<div class="ad-row">
      <div><b>@${jstr(a.username||'')}</b>
        <div class="muted">$${(a.amountCents/100).toFixed(2)} advanced · $${(a.repaidCents/100).toFixed(2)} of $${(a.repayCents/100).toFixed(2)} repaid · ${a.sharePct}% of each sale</div></div>
      <span class="ad-badge ${a.status==='repaid'?'ok':a.status==='active'?'':'bad'}">${jstr(a.status)}</span>
    </div>`).join('') : '<div class="muted">Nobody yet.</div>'}</div>`;
}
async function saveAdvanceCfg(){
  const num = (id) => Number((document.getElementById(id)||{}).value) || 0;
  try {
    await api('/api/admin/advances/config','PUT',{
      enabled: !!(document.getElementById('advOn')||{}).checked,
      maxCents: Math.round(num('advMax')*100), feePct: num('advFee'),
      sharePct: num('advShare'), minSalesCents: Math.round(num('advMin')*100),
    });
    renderAdvancesAdmin();
  } catch(e){ alert('Could not save that.'); }
}

</script>
</body>
</html>
