# Atwe iOS — build in the cloud and ship to TestFlight, no Mac required.
#
# ── MANUAL ONLY. THIS IS DELIBERATE, DO NOT PUT THE PUSH TRIGGER BACK. ──
# It used to run on every push that touched atwe-mobile/**, which meant every single
# change — a colour, an icon, a one-line fix — spent one of the account's monthly iOS
# BUILD CREDITS. That is what ran the credits out in an earlier run, and it happened
# again before anyone noticed: three ordinary commits in one afternoon cost three builds.
#
# The founder's instruction is the right one: build and build and build, then ship ONCE.
# So there is no `on:` trigger here at all. Pushing changes nothing; a build happens only
# when a person asks for one:
#
#     Expo dashboard → Workflows → "Build and submit iOS" → Run workflow
#     or:  cd atwe-mobile && npx eas workflow:run build-ios.yml
#
# Ship at the END of a batch of work, not after each piece of it.

name: Build and submit iOS

jobs:
  build:
    name: Build iOS (production)
    type: build
    params:
      platform: ios
      profile: production
  submit:
    name: Submit to TestFlight
    needs: [build]
    type: submit
    params:
      platform: ios
      profile: production
      build_id: ${{ needs.build.outputs.build_id }}
